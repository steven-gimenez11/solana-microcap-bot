services:
  - type: web
    name: solana-microcap-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: TRADING_ENABLED
        value: "false"
      - key: DATABASE_PATH
        value: data/scanner.db
    healthCheckPath: /health
  - type: worker
    name: solana-microcap-bot-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: TRADING_ENABLED
        value: "false"
      - key: DATABASE_PATH
        value: data/scanner.db